services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: wbs-app
    container_name: wbs-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - wbs-network

  webserver:
    image: nginx:alpine
    container_name: wbs-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - wbs-network

networks:
  wbs-network:
    driver: bridge